name: Keep Alive

# Render Free plan 15 dk hareketsizlikten sonra uykuya dalar; uyandıktan sonraki
# ilk istek 30-50 sn sürer. Bu workflow her 10 dakikada bir /api/health'i pingleyerek
# servisi uyanık tutar → kullanıcının (özellikle sabah ilk açılışta) "yavaşlık" hissi
# ortadan kalkar. Ücretsiz; Render planı değişmez; veritabanına dokunmaz.
#
# Kurulum: GitHub repo → Settings → Secrets and variables → Actions → New secret
#   Name:  RENDER_HEALTH_URL
#   Value: https://<render-uygulama-adi>.onrender.com/api/health
#
# Not: Zamanlanmış (schedule) workflow'lar yalnızca varsayılan branch'te (main) çalışır.
# Bu dosya main'e merge edildiğinde etkinleşir.
#
# ⚠ ÖNEMLİ (2026-07-25 ölçümü): GitHub, public repolarda sık zamanlanmış
# workflow'ları agresif şekilde kısıtlıyor. '*/10' yazılmasına rağmen GERÇEK
# çalışma aralığı ~1 saat, gece 3 saate kadar çıkıyor (günde 144 yerine 12-16
# ping). Render 15 dk'da uyuduğu için bu, cold start'ı önlemeye yetmiyor.
#
# Bu nedenle BİRİNCİL keep-alive mekanizması cron-job.org'dur; bu workflow
# yalnızca YEDEK katmandır. Kurulum adımları: hukuk-takip/DEPLOYMENT.md § 8.

on:
  schedule:
    # GitHub bunu kısıtlayarak uygulayacak; yine de sık istemek daha çok
    # gerçekleşen ping demek. Asıl güvence harici cron.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Eşzamanlı/birikmiş çalışmaları engelle (gecikmeli tetiklemelerde yığılmasın).
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL secret tanımlı değil — atlanıyor."
            exit 0
          fi
          # Best-effort: geçici hata workflow'u kırmızıya boyamasın.
          curl -fsS --max-time 30 "$HEALTH_URL" || echo "Ping başarısız (geçici olabilir), sessiz geçiliyor."
